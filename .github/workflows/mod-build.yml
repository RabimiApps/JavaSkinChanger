name: Build Mod

on:
  push:
    branches: [ mod ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Gradlewアクセス許可
        run: chmod +x gradlew

      - name: Build MOD
        run: ./gradlew build --no-daemon

      - name: Upload MOD artifact
        uses: actions/upload-artifact@v4
        with:
          name: javaskinchanger-fabric
          path: build/libs/javaskinchanger-fabric-1.0.0.jar